<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Efficiency Park: arquitetura proposta e fluxo de dados do MVP</title>
<desc id="desc">A0 usa rede com lâmpadas e reatores. A1 usa LED e sensores na rede. A2 propõe painel, controlador e bateria por poste. A3 propõe FV no quiosque e troca pela rede. No MVP as entradas são manuais e o Python calcula indicadores e apresentação.</desc>
<defs><marker id="seta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L6 4L0 8" fill="none" stroke="#526676" stroke-width="1.5"/></marker><style>text{font-family:Arial,sans-serif;fill:#19372b;font-size:18px}.titulo{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#526676}.box{fill:#eff7f2;stroke:#70957d;stroke-width:1.5}.energia{stroke:#526676;stroke-width:2;fill:none;marker-end:url(#seta)}.dados{stroke:#526676;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#seta)}</style></defs>
<rect width="1280" height="820" rx="15" fill="white"/>
<text x="35" y="43" class="titulo">Efficiency Park · cenários do HTML original</text>
<text x="35" y="74" class="sub">Fontes e automação físicas são propostas. O MVP calcula com dados manuais; não aciona equipamentos.</text>
<text x="45" y="118" font-weight="700">A0 · referência</text><text x="355" y="118" font-weight="700">A1 · LED na rede</text><text x="665" y="118" font-weight="700">A2 · solar isolado</text><text x="975" y="118" font-weight="700">A3 · FV + rede</text>
<rect class="box" x="40" y="140" width="260" height="58" rx="8"/><text x="170" y="175" text-anchor="middle">Rede elétrica</text>
<rect class="box" x="350" y="140" width="260" height="58" rx="8"/><text x="480" y="175" text-anchor="middle">Rede elétrica</text>
<rect class="box" x="660" y="140" width="260" height="58" rx="8"/><text x="790" y="175" text-anchor="middle">Painel + controlador</text>
<rect class="box" x="970" y="140" width="260" height="58" rx="8"/><text x="1100" y="175" text-anchor="middle">FV no quiosque</text>
<path class="energia" d="M170 198V300"/><path class="energia" d="M480 198V300"/><path class="energia" d="M790 198V216"/><path class="energia" d="M1100 198V216"/>
<rect class="box" x="660" y="224" width="260" height="58" rx="8"/><text x="790" y="259" text-anchor="middle">Bateria + driver CC</text>
<rect class="box" x="970" y="224" width="260" height="58" rx="8"/><text x="1100" y="249" text-anchor="middle">Troca pela rede</text><text x="1100" y="271" class="sub" text-anchor="middle">crédito financeiro hipotético</text>
<path class="energia" d="M790 282V300"/><path class="energia" d="M1100 282V300"/>
<rect class="box" x="40" y="308" width="260" height="76" rx="8"/><text x="170" y="339" text-anchor="middle">Lâmpadas + reatores</text><text x="170" y="365" class="sub" text-anchor="middle">sem dimerização</text>
<rect class="box" x="350" y="308" width="260" height="76" rx="8"/><text x="480" y="339" text-anchor="middle">LED + sensor + IoT</text><text x="480" y="365" class="sub" text-anchor="middle">driver e controle compatíveis</text>
<rect class="box" x="660" y="308" width="260" height="76" rx="8"/><text x="790" y="339" text-anchor="middle">LED + sensor + IoT</text><text x="790" y="365" class="sub" text-anchor="middle">sem rede de apoio</text>
<rect class="box" x="970" y="308" width="260" height="76" rx="8"/><text x="1100" y="339" text-anchor="middle">LED + sensor + IoT</text><text x="1100" y="365" class="sub" text-anchor="middle">rede à noite / geração de dia</text>
<text x="40" y="424" class="sub">Validar iluminação mínima, componentes, tensões, recurso solar, medição e orçamento antes da implantação.</text>
<rect class="box" x="205" y="475" width="870" height="64" rx="8"/><text x="640" y="504" text-anchor="middle">Professor altera os parâmetros na interface</text><text x="640" y="527" class="sub" text-anchor="middle">postes, potências, presença, dimerização, solar, custos e horizonte</text>
<path class="dados" d="M640 539V560"/>
<rect class="box" x="205" y="568" width="870" height="64" rx="8"/><text x="640" y="598" text-anchor="middle">Python · consumo, geração, déficit, manutenção, retorno e balanço ambiental</text><text x="640" y="620" class="sub" text-anchor="middle">mesmas fórmulas para os indicadores e para o HTML exportado</text>
<path class="dados" d="M640 632V653"/>
<rect class="box" x="205" y="661" width="870" height="64" rx="8"/><text x="640" y="691" text-anchor="middle">Dashboard + apresentação + JSON da simulação</text><text x="640" y="713" class="sub" text-anchor="middle">kWh, R$, %, déficit, CO₂ potencial no balanço e tempo em espera</text>
<text x="35" y="775" class="sub">Contínuo: energia proposta. Tracejado: fluxo de dados do software. Gráficos e animação são simulados.</text>
</svg>
