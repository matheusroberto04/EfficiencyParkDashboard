<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
  <title id="title">Funcionamento conceitual do Praça Eficiente</title>
  <desc id="desc">A rede alimenta o LED na alternativa A. Painel solar e bateria alimentam o LED na alternativa B. Dados são digitados manualmente e calculados para apresentação no dashboard.</desc>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#334155" stroke-width="1.6"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172b24;font-size:17px} .titulo{font-size:24px;font-weight:700}.menor{font-size:14px;fill:#475569}.box{fill:#f1f8f4;stroke:#56836a;stroke-width:1.5}.energia{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#seta)}.dados{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#seta)}</style>
  </defs>
  <rect width="900" height="610" rx="12" fill="#fff"/>
  <text x="35" y="40" class="titulo">Praça Eficiente · energia e informação</text>
  <text x="35" y="67" class="menor">Diagrama conceitual. O protótipo calcula cenários; não controla equipamentos.</text>
  <text x="60" y="111" font-weight="700">Alternativa A</text>
  <text x="530" y="111" font-weight="700">Alternativa B</text>
  <rect class="box" x="60" y="130" width="270" height="54" rx="8"/>
  <text x="195" y="164" text-anchor="middle">Rede elétrica</text>
  <rect class="box" x="530" y="130" width="270" height="54" rx="8"/>
  <text x="665" y="164" text-anchor="middle">Painel solar</text>
  <path class="energia" d="M195 184 V266"/>
  <path class="energia" d="M665 184 V205"/>
  <rect class="box" x="530" y="208" width="270" height="48" rx="8"/>
  <text x="665" y="239" text-anchor="middle">Controlador e bateria</text>
  <path class="energia" d="M665 256 V273"/>
  <rect class="box" x="60" y="277" width="270" height="54" rx="8"/>
  <text x="195" y="311" text-anchor="middle">Luminárias LED</text>
  <rect class="box" x="530" y="277" width="270" height="54" rx="8"/>
  <text x="665" y="311" text-anchor="middle">Luminárias LED</text>
  <path class="dados" d="M195 331 V359 H430 V386"/>
  <path class="dados" d="M665 331 V359 H430"/>
  <text x="450" y="380" class="menor">Dados do cenário atual e das alternativas</text>
  <rect class="box" x="195" y="393" width="470" height="54" rx="8"/>
  <text x="430" y="426" text-anchor="middle">Entrada manual: potência, tempo, custos</text>
  <path class="dados" d="M430 447 V465"/>
  <rect class="box" x="195" y="472" width="470" height="48" rx="8"/>
  <text x="430" y="503" text-anchor="middle">Python: cálculos de consumo e comparação</text>
  <path class="dados" d="M430 520 V537"/>
  <rect class="box" x="195" y="544" width="470" height="48" rx="8"/>
  <text x="430" y="575" text-anchor="middle">Dashboard: kWh, economia, custos e % solar</text>
</svg>
